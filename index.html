<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adeeb Technology Lab — Computer Courses</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/ATLabLogo.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">


<nav class="nav">
  <div class="brand">
   <img src="assets/ATLabLogo.png" alt="Adeeb Technology Lab Logo" class="brand-logo">
    Adeeb Technology Lab
  </div>
  <button class="theme-toggle-icon" onclick="toggleTheme()" id="toggleBtn" aria-label="Toggle theme">
    ☀️
  </button>
</nav>

<section class="hero">
  <canvas id="bgCanvas"></canvas>

  <div class="hero-content">
    <div class="hero-badge">📚 100% Free Access</div>
    <h1 class="hero-title">The Computer Courses</h1>
    <div class="hero-underline">
      <svg viewBox="0 0 220 12" width="220" height="12">
        <path d="M2 8 Q 55 2, 110 8 T 218 6" stroke="var(--orange)" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="hero-location">Bahawalpur, Islamabad</p>
    <p class="hero-tagline" id="heroTagline">Access our course books for free — explore, learn, and grow.</p>
  </div>
</section>



<div class="filter-wrap">
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/>
      <path d="M21 21l-4.3-4.3"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Search courses...">
  </div>
</div>

<div class="wrap">
  <div class="count" id="countLabel"></div>
  <div class="grid" id="grid"></div>
</div>

<footer>
  © 2026 Adeeb Technology Lab — Built for learners, one shelf at a time.
</footer>

<script src="courses-data.js"></script>
<script src="script.js"></script>
<script src="bg-network.js"></script>

</body>
</html>
